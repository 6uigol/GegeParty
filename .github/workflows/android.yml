name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A3 build.log | head -150

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GegeParty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GegeParty-apk
          path: GegeParty.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GegeParty v1.0.${{ github.run_number }}
          body: "APK pronto para instalar no Android 🎈 — baixe o GegeParty.apk abaixo."
          files: GegeParty.apk
          make_latest: true
